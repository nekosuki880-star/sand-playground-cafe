<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#F5F8FF">
<title>모래놀이터 카페 - 음료 키오스크</title>
<style>
:root{--navy:#24324a;--blue:#3867d6;--blue-light:#eaf0ff;--green:#16845b;--bg:#f5f8ff;--white:#fff;--muted:#64748b;--line:#dce4f2;--orange:#ffbd59}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif}
button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:4px solid #ffbf47;outline-offset:3px}
.app{max-width:1000px;margin:0 auto;min-height:100vh;padding:clamp(12px,3vw,28px);display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;font-size:clamp(21px,4vw,31px);letter-spacing:-1px}
.speak{border:2px solid var(--line);background:white;border-radius:16px;padding:12px 16px;font-weight:800;color:var(--navy);min-height:52px}
.progress-wrap{background:#e2e9f6;height:10px;border-radius:99px;overflow:hidden}.progress{height:100%;width:20%;background:var(--blue);border-radius:99px;transition:width .25s}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.step{border:2px solid var(--line);background:white;border-radius:14px;padding:10px 4px;text-align:center;color:var(--muted);font-size:clamp(11px,2.3vw,15px);font-weight:800}
.step.active{border-color:var(--blue);background:var(--blue-light);color:var(--blue)}.step.done{border-color:#b8e4d0;background:#edfaf3;color:var(--green)}
main{flex:1}.panel{background:white;border:2px solid var(--line);border-radius:24px;padding:clamp(16px,3vw,28px);box-shadow:0 8px 24px #24324a0a}
h1{font-size:clamp(26px,5vw,40px);margin:0 0 8px;letter-spacing:-1px}.sub{color:var(--muted);font-size:clamp(16px,2.7vw,19px);line-height:1.5;margin:0 0 22px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.choice{min-height:142px;border:3px solid var(--line);background:white;border-radius:20px;padding:14px 8px;color:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.choice:active{transform:scale(.98)}.choice.selected{border-color:var(--blue);background:var(--blue-light)}.emoji{font-size:clamp(44px,9vw,70px);line-height:1.1}.choice strong{font-size:clamp(17px,3vw,22px)}.price{color:var(--muted);font-weight:700}
.notice{background:#fff6e6;border:2px solid #ffe1a8;padding:13px 16px;border-radius:15px;font-weight:700;line-height:1.45;margin-bottom:18px}
.actions{display:flex;gap:12px;margin-top:22px}.primary,.secondary{flex:1;border:0;border-radius:17px;min-height:60px;padding:14px 18px;font-size:clamp(18px,3vw,22px);font-weight:900}.primary{background:var(--blue);color:white}.primary:disabled{background:#b8c4d9;cursor:not-allowed}.secondary{background:#edf1f8;color:var(--navy)}
.summary{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}.summary:last-child{border-bottom:0}.summary .emoji{font-size:42px}.summary-info{flex:1}.summary-info strong{display:block;font-size:19px}.qty{display:flex;align-items:center;gap:10px}.qty button{width:42px;height:42px;border:2px solid var(--line);border-radius:12px;background:white;font-size:24px;font-weight:900}
.total{display:flex;justify-content:space-between;align-items:center;padding-top:18px;margin-top:10px;border-top:2px dashed var(--line);font-size:22px;font-weight:900}
.success{text-align:center;padding:20px 8px}.success .big{font-size:clamp(70px,16vw,120px)}.success h1{color:var(--green)}.order-number{display:inline-block;margin:14px 0;padding:10px 20px;border-radius:14px;background:#edfaf3;color:var(--green);font-size:22px;font-weight:900}
.preview-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:18px 0}
.preview-card{border:2px solid var(--line);background:#fffdf8;border-radius:22px;padding:16px;text-align:center;min-width:0}
.preview-card h2{font-size:22px;margin:0 0 8px}
.preview-art{min-height:230px;position:relative;display:flex;align-items:center;justify-content:space-evenly;gap:8px;padding:12px;box-sizing:border-box;overflow:hidden;border-radius:18px;background:linear-gradient(#fff9ef,#f7eddb)} .preview-base{font-size:clamp(76px,12vw,108px);filter:drop-shadow(0 5px 3px #6b4a251c);z-index:1;flex:0 0 42%;text-align:center} .preview-toppings{position:static;z-index:2;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-content:center;justify-items:center;gap:8px;flex:0 0 52%;pointer-events:none} .preview-top{position:static;width:clamp(64px,9vw,88px);height:clamp(64px,9vw,88px);object-fit:cover;border:3px solid #fff;border-radius:50%;box-shadow:0 3px 9px #0005;background:#fff}.topping-photo{display:block;width:100%;height:90px;object-fit:cover;border-radius:13px;margin-bottom:8px}@media(max-width:560px){.topping-photo{height:78px}}
.preview-label{font-weight:800;font-size:18px;margin-top:10px}
.preview-caption{color:var(--muted);font-size:14px;line-height:1.45;margin-top:5px}
@media(max-width:560px){.preview-art{min-height:230px;padding:8px;gap:4px}.preview-base{font-size:clamp(68px,20vw,92px);flex-basis:46%}.preview-toppings{flex-basis:52%;gap:4px}.preview-top{width:clamp(36px,10vw,48px);height:clamp(36px,10vw,48px)}.preview-list{grid-template-columns:1fr}}
footer{text-align:center;color:var(--muted);font-size:13px;padding-bottom:4px}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.choice{min-height:125px}.actions{position:sticky;bottom:8px}.panel{border-radius:20px}.brand{font-size:21px}.steps{gap:4px}.step{border-radius:11px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* 세로형 키오스크 및 iPad 최적화 */
html { min-height: 100%; }
body { min-height: 100vh; min-height: 100dvh; }
.app {
  width: 100%;
  max-width: 820px;
  min-height: 100vh;
  min-height: 100dvh;
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  gap: 14px;
}
.panel { padding: clamp(18px, 3.2vw, 30px); }
.steps { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.step { min-width: 0; font-size: clamp(13px, 1.8vw, 16px); padding: 12px 5px; }
.grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.choice { min-height: clamp(132px, 18vh, 176px); }
.emoji { font-size: clamp(48px, 7vw, 76px); }
.preview-list { grid-template-columns: minmax(0, 1fr); }
.preview-art { min-height: clamp(250px, 34vh, 360px); }
.preview-top { width: clamp(66px, 8vw, 92px); height: clamp(66px, 8vw, 92px); }
.actions { gap: 14px; }
.primary, .secondary { min-height: 66px; }
@media (orientation: portrait) and (min-width: 700px) {
  .app { max-width: 820px; gap: 16px; }
  .brand { font-size: clamp(25px, 3.4vw, 32px); }
  .speak { min-height: 58px; font-size: 18px; }
  .panel { padding: 28px; }
  h1 { font-size: clamp(32px, 4.2vw, 42px); }
  .sub { font-size: 20px; }
  .grid { gap: 16px; }
  .choice { min-height: 160px; }
  .choice strong { font-size: 22px; }
  .topping-photo { height: 112px; }
  .preview-card h2 { font-size: 25px; }
  .preview-art { min-height: 320px; }
  .preview-top { width: clamp(76px, 9vw, 96px); height: clamp(76px, 9vw, 96px); }
}
@media (max-width: 560px) {
  .app { padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
  .steps { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .step { font-size: 12px; }
  .preview-art { min-height: 250px; }
  .preview-top { width: clamp(48px, 13vw, 64px); height: clamp(48px, 13vw, 64px); }
}


/* 3단계 주문 확인: 사진을 크게 보여주는 직사각형 토핑 카드 */
.confirm-menu{font-size:clamp(30px,5vw,45px);font-weight:900;margin:8px 0 20px;padding:12px;border-radius:16px;background:#fff5e4}
.confirm-toppings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;width:100%;margin:14px auto 22px}
.confirm-topping{border:3px solid #d5c2a7;border-radius:18px;overflow:hidden;background:#fff;min-width:0;box-shadow:0 4px 10px #00000012}
.confirm-topping img{display:block;width:100%;height:clamp(190px,30vw,330px);object-fit:cover;object-position:center}
.confirm-topping-name{font-weight:900;font-size:clamp(19px,2.6vw,28px);padding:12px 6px;line-height:1.25;color:#25334b}
@media(max-width:540px){.confirm-toppings{gap:10px}.confirm-topping img{height:clamp(155px,45vw,230px)}.confirm-topping-name{font-size:18px;padding:10px 4px}}
</style>
</head>

let step=0, selectedMenu=null, selectedToppings=[], cart=[];
let lastSpoken='모래놀이터 카페에 오신 것을 환영해요. 음료를 골라 보세요.';
const main=document.getElementById('main');
function speak(text){lastSpoken=text;if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';u.rate=.9;u.pitch=1;window.speechSynthesis.speak(u)}
function updateSteps(){document.querySelectorAll('.step').forEach((el,i)=>{el.classList.toggle('active',i===step);el.classList.toggle('done',i<step)});document.getElementById('progress').style.width=([25,50,75,100][step])+'%'}
function render(){updateSteps();if(step===0)renderMenu();if(step===1)renderToppings();if(step===2)renderConfirm();if(step===3)renderPayment()}
function renderMenu(){
main.innerHTML=`<section class="panel"><h1>무엇을 만들까요?</h1><p class="sub">음료 그림을 눌러 주문을 시작해요.</p><div class="notice">음료만 주문할 수 있어요. 모래와 자연물로 멋지게 만들어 봐요!</div><div class="grid">${menus.map(m=>`<button class="choice ${selectedMenu?.id===m.id?'selected':''}" data-menu="${m.id}" aria-pressed="${selectedMenu?.id===m.id}"><span class="emoji">${m.emoji}</span><strong>${m.name}</strong><span class="price">${m.description}</span></button>`).join('')}</div><div class="actions"><button class="secondary" id="reset">처음부터</button><button class="primary" id="next" ${selectedMenu?'':'disabled'}>다음: 토핑 선택 →</button></div></section>`;
main.querySelectorAll('[data-menu]').forEach(b=>b.onclick=()=>{selectedMenu=menus.find(m=>m.id===b.dataset.menu);selectedToppings=[];speak(selectedMenu.name+'을 골랐어요. 다음은 토핑을 골라요.');render()});
document.getElementById('next').onclick=()=>{if(selectedMenu){step=1;speak('어떤 토핑을 올릴까요?');render()}};
document.getElementById('reset').onclick=reset;
}
function renderToppings(){
main.innerHTML=`<section class="panel"><h1>${selectedMenu?selectedMenu.emoji+' '+selectedMenu.name:''} 토핑을 골라요</h1><p class="sub">올리고 싶은 토핑을 여러 개 선택해요. 그림은 모래놀이터의 자연물로 바꾸어 사용할 수 있어요.</p><div class="notice">사진을 보고 원하는 자연물 토핑을 골라 보세요.</div><div class="grid">${toppings.map(t=>`<button class="choice ${selectedToppings.includes(t.id)?'selected':''}" data-top="${t.id}" aria-pressed="${selectedToppings.includes(t.id)}"><img class="topping-photo" src="${t.image}" alt="${t.name} 사진"><strong>${t.name}</strong><span class="price">${t.kind}</span>${selectedToppings.includes(t.id)?'<span>✓ 선택했어요</span>':''}</button>`).join('')}</div><div class="actions"><button class="secondary" id="back">← 메뉴 고르기</button><button class="primary" id="next">토핑 선택 완료 →</button></div></section>`;
main.querySelectorAll('[data-top]').forEach(b=>b.onclick=()=>{const t=toppings.find(x=>x.id===b.dataset.top);if(selectedToppings.includes(t.id)){selectedToppings=selectedToppings.filter(id=>id!==t.id);speak(t.name+' 선택을 취소했어요.')}else{selectedToppings.push(t.id);speak(t.name+' 토핑을 골랐어요.')}render()});
document.getElementById('back').onclick=()=>{step=0;speak('메뉴를 다시 골라요.');render()};
document.getElementById('next').onclick=()=>{cart=[{menu:selectedMenu,toppings:[...selectedToppings]}];step=2;speak('선택한 메뉴와 토핑을 확인해요.');render()};
}
function renderConfirm(){
const item=cart[0];
const picked=item.toppings.map(id=>toppings.find(t=>t.id===id)).filter(Boolean);
const toppingMarks=picked.length?picked.map(t=>`<div class="confirm-topping"><img src="${t.image}" alt="${t.name}"><div class="confirm-topping-name">${t.name}</div></div>`).join(''):'<p class="sub">선택한 토핑이 없어요.</p>';
main.innerHTML=`<section class="panel"><h1>주문을 확인해요</h1><p class="sub">내가 고른 메뉴와 토핑이 맞는지 확인해요.</p><div class="preview-list"><div class="preview-card"><h2>${item.menu.emoji} ${item.menu.name}</h2><div class="confirm-menu">${item.menu.id==='cake'?'🍰':'🥤'} ${item.menu.name}</div><div class="confirm-toppings">${toppingMarks}</div></div><div class="preview-label">토핑 ${picked.length}개</div><div class="preview-caption">${picked.length?picked.map(t=>t.name).join(' · '):'토핑을 선택하지 않았어요'}</div></div></div><div class="notice">주문 내용을 말로 표현해 봐요. “케이크에 나뭇잎과 돌을 올릴 거예요.”</div><div class="actions"><button class="secondary" id="back">← 다시 고르기</button><button class="primary" id="finish">결제하러 가기 →</button></div></section>`;
document.getElementById('back').onclick=()=>{step=1;speak('토핑을 다시 골라요.');render()};
document.getElementById('finish').onclick=()=>{step=3;speak('결제 방법을 골라 주세요.');render()};
}
let paymentMethod=null, paid=false;
function renderPayment(){
const item=cart[0];
const picked=item.toppings.map(id=>toppings.find(t=>t.id===id)).filter(Boolean);
main.innerHTML=`<section class="panel">
<h1>💳 결제해요</h1>
<p class="sub">카페에서 주문한 메뉴를 결제하는 놀이예요.</p>
<div class="notice">역할놀이용 가상 결제입니다. 실제 돈은 결제되지 않아요.</div>
<div class="preview-card" style="margin-bottom:18px">
<h2>${item.menu.emoji} ${item.menu.name}</h2>
<div class="preview-label">토핑 ${picked.length}개</div>
<div class="preview-caption">${picked.length?picked.map(t=>t.name).join(' · '):'토핑 없음'}</div>
</div>
${paid?`<div class="success" role="status"><div class="big">✅</div><h1>결제했어요!</h1><p class="sub">${paymentMethod==='card'?'카드':'현금'}으로 결제하는 놀이를 마쳤어요.<br>이제 모래놀이터 카페에서 메뉴를 만들어 보세요!</p></div>
<div class="actions"><button class="secondary" id="back">← 주문 내용 보기</button><button class="primary" id="restart">처음부터 다시 하기 ↻</button></div>`:
`<h2 style="font-size:clamp(21px,3.5vw,27px)">어떻게 결제할까요?</h2>
<div class="grid">
<button class="choice ${paymentMethod==='card'?'selected':''}" data-pay="card" aria-pressed="${paymentMethod==='card'}"><span class="emoji">💳</span><strong>카드</strong><span class="price">카드를 대요</span></button>
<button class="choice ${paymentMethod==='cash'?'selected':''}" data-pay="cash" aria-pressed="${paymentMethod==='cash'}"><span class="emoji">💵</span><strong>현금</strong><span class="price">돈을 내요</span></button>
</div>
<div class="actions"><button class="secondary" id="back">← 주문 확인</button><button class="primary" id="pay" ${paymentMethod?'':'disabled'}>결제하기 →</button></div>`}
</section>`;
document.getElementById('back').onclick=()=>{step=2;paid=false;speak('주문 내용을 확인해요.');render()};
if(paid){document.getElementById('restart').onclick=reset}
else{

}
